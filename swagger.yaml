openapi: 3.0.0
info:
  title: FixUp Garage Management API
  description: API pour la gestion complète d'un garage automobile, incluant clients, devis, réparations, facturation, stock et commandes.
  version: "1.3.0"
servers:
  - url: /api/v1
    description: Serveur de l'API de développement

tags:
  - name: Clients
    description: Gestion des fiches clients et de leurs véhicules.
  - name: Quotes
    description: Création et gestion des devis.
  - name: Repair Orders
    description: Suivi des fiches de réparation.
  - name: Invoices
    description: Gestion de la facturation et des paiements.
  - name: Stock
    description: Gestion des pièces et de l'inventaire.
  - name: Purchases
    description: Gestion des commandes fournisseurs.
  - name: Technicians
    description: Gestion des techniciens de l'atelier.
  - name: Scheduler
    description: Planification des rendez-vous.
  - name: Catalogue
    description: Gestion des modèles d'intervention.
  - name: Accounting
    description: Suivi des transactions financières.
  - name: Configuration
    description: Paramètres de l'application.

paths:
  /clients:
    get:
      summary: Récupérer la liste des clients
      tags: [Clients]
      responses:
        '200':
          description: Une liste de clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
    post:
      summary: Créer un nouveau client
      tags: [Clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '201':
          description: Client créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'

  /clients/{clientId}:
    get:
      summary: Récupérer un client par son ID
      tags: [Clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails du client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
    put:
      summary: Mettre à jour un client
      tags: [Clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '200':
          description: Client mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
    delete:
      summary: Supprimer un client
      tags: [Clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Client supprimé

  /quotes:
    get:
      summary: Récupérer la liste des devis
      tags: [Quotes]
      responses:
        '200':
          description: Une liste de devis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quote'
    post:
      summary: Créer un nouveau devis
      tags: [Quotes]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteInput'
      responses:
        '201':
          description: Devis créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
  
  /quotes/{quoteId}:
    get:
      summary: Récupérer un devis par son ID
      tags: [Quotes]
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails du devis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
    put:
      summary: Mettre à jour un devis
      tags: [Quotes]
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteInput'
      responses:
        '200':
          description: Devis mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
    delete:
      summary: Supprimer un devis
      tags: [Quotes]
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Devis supprimé

  /quotes/{quoteId}/status:
    put:
      summary: Changer le statut d'un devis
      tags: [Quotes]
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/QuoteStatus'
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
  
  /repair-orders:
    get:
      summary: Récupérer les fiches de réparation
      tags: [Repair Orders]
      responses:
        '200':
          description: Liste des fiches de réparation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepairOrder'
    post:
      summary: Créer une fiche de réparation (depuis un devis)
      tags: [Repair Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quoteId:
                  type: string
                  description: L'ID du devis approuvé à convertir.
      responses:
        '201':
          description: Fiche de réparation créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrder'

  /repair-orders/{orderId}:
    get:
      summary: Récupérer une fiche de réparation
      tags: [Repair Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails de la fiche de réparation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrder'
    put:
      summary: Mettre à jour une fiche de réparation
      tags: [Repair Orders]
      description: Permet de changer le statut, d'assigner un technicien, d'ajouter des notes, etc.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairOrderInput'
      responses:
        '200':
          description: Fiche de réparation mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrder'
    delete:
      summary: Supprimer une fiche de réparation
      tags: [Repair Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Fiche de réparation supprimée
  
  /invoices:
    get:
      summary: Récupérer les factures
      tags: [Invoices]
      responses:
        '200':
          description: Liste des factures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
    post:
      summary: Créer une facture (depuis une fiche de réparation)
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repairOrderId:
                  type: string
                  description: L'ID de la fiche de réparation à facturer.
      responses:
        '201':
          description: Facture créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/{invoiceId}:
    delete:
      summary: Supprimer une facture
      tags: [Invoices]
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Facture supprimée
          
  /invoices/{invoiceId}/pay:
    post:
      summary: Marquer une facture comme payée
      tags: [Invoices]
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDetails'
      responses:
        '200':
          description: Facture mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /parts:
    get:
      summary: Récupérer l'inventaire des pièces
      tags: [Stock]
      responses:
        '200':
          description: Liste des pièces en stock
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Part'
    post:
      summary: Ajouter une nouvelle pièce au stock
      tags: [Stock]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartInput'
      responses:
        '201':
          description: Pièce créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'

  /parts/{partId}:
    put:
      summary: Mettre à jour une pièce
      tags: [Stock]
      parameters:
        - name: partId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartInput'
      responses:
        '200':
          description: Pièce mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
    delete:
      summary: Supprimer une pièce
      tags: [Stock]
      parameters:
        - name: partId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Pièce supprimée

  /purchase-orders:
    get:
      summary: Récupérer les commandes fournisseurs
      tags: [Purchases]
      responses:
        '200':
          description: Liste des commandes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrder'
    post:
      summary: Créer une commande fournisseur
      tags: [Purchases]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '201':
          description: Commande créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'

  /purchase-orders/{orderId}:
    put:
      summary: Mettre à jour une commande fournisseur
      tags: [Purchases]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '200':
          description: Commande mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
    delete:
      summary: Supprimer une commande fournisseur
      tags: [Purchases]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Commande supprimée

  /purchase-orders/{orderId}/receive:
    post:
      summary: Marquer une commande fournisseur comme reçue
      tags: [Purchases]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Commande mise à jour

  /purchase-orders/{orderId}/pay:
    post:
      summary: Enregistrer le paiement d'une commande
      tags: [Purchases]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDetails'
      responses:
        '200':
          description: Commande mise à jour
  
  /technicians:
    get:
      summary: Récupérer la liste des techniciens
      tags: [Technicians]
      responses:
        '200':
          description: Une liste de techniciens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Technician'
    post:
      summary: Ajouter un nouveau technicien
      tags: [Technicians]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianInput'
      responses:
        '201':
          description: Technicien ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Technician'

  /technicians/{technicianId}:
    put:
      summary: Mettre à jour un technicien
      tags: [Technicians]
      parameters:
        - name: technicianId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianInput'
      responses:
        '200':
          description: Technicien mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Technician'
    delete:
      summary: Supprimer un technicien
      tags: [Technicians]
      parameters:
        - name: technicianId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Technicien supprimé

  /templates:
    get:
      summary: Récupérer les modèles d'intervention
      tags: [Catalogue]
      responses:
        '200':
          description: Liste des modèles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterventionTemplate'
    post:
      summary: Créer un nouveau modèle d'intervention
      tags: [Catalogue]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterventionTemplateInput'
      responses:
        '201':
          description: Modèle créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterventionTemplate'

  /templates/{templateId}:
    get:
      summary: Récupérer un modèle par son ID
      tags: [Catalogue]
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails du modèle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterventionTemplate'
    put:
      summary: Mettre à jour un modèle
      tags: [Catalogue]
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterventionTemplateInput'
      responses:
        '200':
          description: Modèle mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterventionTemplate'
    delete:
      summary: Supprimer un modèle
      tags: [Catalogue]
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Modèle supprimé
                  
  /appointments:
    get:
      summary: Récupérer les rendez-vous
      tags: [Scheduler]
      responses:
        '200':
          description: Liste des rendez-vous
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
    post:
      summary: Créer un nouveau rendez-vous
      tags: [Scheduler]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentInput'
      responses:
        '201':
          description: Rendez-vous créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'

  /appointments/{appointmentId}:
    get:
      summary: Récupérer un rendez-vous par son ID
      tags: [Scheduler]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails du rendez-vous
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
    put:
      summary: Mettre à jour un rendez-vous
      tags: [Scheduler]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentInput'
      responses:
        '200':
          description: Rendez-vous mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
    delete:
      summary: Supprimer un rendez-vous
      tags: [Scheduler]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Rendez-vous supprimé
  
  /transactions:
    get:
      summary: Récupérer les transactions financières
      tags: [Accounting]
      responses:
        '200':
          description: Grand livre des transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialTransaction'
  
  /settings:
    get:
      summary: Récupérer les paramètres du garage
      tags: [Configuration]
      responses:
        '200':
          description: Paramètres actuels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      summary: Mettre à jour les paramètres du garage
      tags: [Configuration]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Paramètres mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'

components:
  schemas:
    VehicleServiceHistory:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date-time }
        mileage: { type: number }
        description: { type: string }
        referenceId: { type: string, nullable: true, description: "Link to RepairOrder ID" }

    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        licensePlate: { type: string }
        make: { type: string }
        model: { type: string }
        vin: { type: string, nullable: true }
        serviceHistory:
          type: array
          items:
            $ref: '#/components/schemas/VehicleServiceHistory'

    Client:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        postalCode: { type: string }
        city: { type: string }
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
    
    ClientInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        postalCode: { type: string }
        city: { type: string }
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
            
    PartItem:
      type: object
      properties:
        id: { type: string }
        partId: { type: string }
        description: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }

    LaborTask:
      type: object
      properties:
        id: { type: string }
        description: { type: string }
        hours: { type: number }
        rate: { type: number }
        partItems:
          type: array
          items:
            $ref: '#/components/schemas/PartItem'

    LaborTaskInput:
      type: object
      properties:
        description: { type: string }
        hours: { type: number }
        rate: { type: number }
        partItems:
          type: array
          items:
            $ref: '#/components/schemas/PartItem'
            
    QuoteStatus:
      type: string
      enum: [draft, sent, approved, rejected]
      
    QuoteStatusHistory:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/QuoteStatus'
        date:
          type: string
          format: date-time
          
    Quote:
      type: object
      properties:
        id: { type: string }
        quoteNumber: { type: string }
        clientId: { type: string }
        vehicleId: { type: string }
        date: { type: string, format: date-time }
        validityDuration: { type: number }
        taxRate: { type: number }
        status:
          $ref: '#/components/schemas/QuoteStatus'
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/QuoteStatusHistory'
        isConvertedToRepairOrder: { type: boolean, nullable: true }
        repairDate: { type: string, format: date-time, nullable: true }
        laborItems:
          type: array
          items:
            $ref: '#/components/schemas/LaborTask'
    
    QuoteInput:
      type: object
      properties:
        clientId: { type: string }
        vehicleId: { type: string }
        date: { type: string, format: date-time }
        taxRate: { type: number }
        laborItems:
          type: array
          items:
            $ref: '#/components/schemas/LaborTask'
            
    Part:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        reference: { type: string }
        supplier: { type: string }
        stock: { type: integer }
        purchasePrice: { type: number }
        pricingMethod: { type: string, enum: [fixed, markup] }
        sellingPrice: { type: number, nullable: true }
        markupPercentage: { type: number, nullable: true }

    PartInput:
      type: object
      properties:
        name: { type: string }
        reference: { type: string }
        supplier: { type: string }
        stock: { type: integer }
        purchasePrice: { type: number }
        pricingMethod: { type: string, enum: [fixed, markup] }
        sellingPrice: { type: number, nullable: true }
        markupPercentage: { type: number, nullable: true }

    VehicleInspectionItem:
      type: object
      properties:
        id: { type: string }
        description: { type: string }
        photo: { type: string, description: "Base64 encoded image" }
        
    VehicleInspectionReport:
      type: object
      properties:
        id: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/VehicleInspectionItem'
        notes: { type: string }

    RepairOrderStatus:
      type: string
      enum: [scheduled, workshop_entry, diagnosis_complete, in_progress, waiting_for_part, completed, waiting_for_invoicing, invoiced, cancelled]

    RepairOrder:
      type: object
      properties:
        id: { type: string }
        quote:
          $ref: '#/components/schemas/Quote'
        status:
          $ref: '#/components/schemas/RepairOrderStatus'
        technicianId: { type: string, nullable: true }
        inspectionReport:
          $ref: '#/components/schemas/VehicleInspectionReport'
          nullable: true
        notes: { type: string, nullable: true }
        mileage: { type: number, nullable: true }

    RepairOrderInput:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/RepairOrderStatus'
        technicianId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        mileage: { type: number, nullable: true }
        
    PaymentDetails:
      type: object
      properties:
        date: { type: string, format: date-time }
        method: { type: string, enum: [card, cash, transfer, other] }

    InvoiceStatus:
      type: string
      enum: [draft, paid, cancelled]
      
    Invoice:
      type: object
      properties:
        id: { type: string }
        invoiceNumber: { type: string }
        quote:
          $ref: '#/components/schemas/Quote'
